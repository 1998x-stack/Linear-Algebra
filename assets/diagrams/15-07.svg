<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="15-07-t 15-07-d"><title id="15-07-t">k=1 与 k=2</title><desc id="15-07-d">增加主成分会提高解释方差并降低重建误差。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536b70"/></marker></defs><rect width="800" height="380" fill="#fff"/><text x="35" y="38" font-size="14" font-weight="800" fill="#137d78">15-07</text><rect x="55" y="92" width="325" height="210" rx="16" fill="#e7f3ef" stroke="#137d78" stroke-width="2"/><rect x="420" y="92" width="325" height="210" rx="16" fill="#fff0e8" stroke="#c7684b" stroke-width="2"/><text x="217" y="130" text-anchor="middle" font-size="21" fill="#137d78">k=1</text><text x="582" y="130" text-anchor="middle" font-size="21" fill="#c7684b">k=2</text><text x="90" y="178" font-size="18" fill="#20363b">• 保留 80% 方差</text><text x="90" y="220" font-size="18" fill="#20363b">• 平方误差 2</text><text x="90" y="262" font-size="18" fill="#20363b">• 一维表示</text><text x="455" y="178" font-size="18" fill="#20363b">• 保留 100% 方差</text><text x="455" y="220" font-size="18" fill="#20363b">• 平方误差 0</text><text x="455" y="262" font-size="18" fill="#20363b">• 完整二维表示</text><text x="400" y="355" text-anchor="middle" font-size="16" fill="#5b6b72">增加主成分会提高解释方差并降低重建误差。</text></svg>