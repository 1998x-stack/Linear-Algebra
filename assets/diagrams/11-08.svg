<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="11-08-t 11-08-d"><title id="11-08-t">方阵与长方形矩阵</title><desc id="11-08-d">检查矩阵尺寸才能判断 QQᵀ 是否为单位矩阵。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536b70"/></marker></defs><rect width="800" height="380" fill="#fff"/><text x="35" y="38" font-size="14" font-weight="800" fill="#137d78">11-08</text><rect x="55" y="92" width="325" height="210" rx="16" fill="#e7f3ef" stroke="#137d78" stroke-width="2"/><rect x="420" y="92" width="325" height="210" rx="16" fill="#fff0e8" stroke="#c7684b" stroke-width="2"/><text x="217" y="130" text-anchor="middle" font-size="21" fill="#137d78">方阵 Q</text><text x="582" y="130" text-anchor="middle" font-size="21" fill="#c7684b">长方形 Q</text><text x="90" y="178" font-size="18" fill="#20363b">• QᵀQ=I</text><text x="90" y="220" font-size="18" fill="#20363b">• QQᵀ=I</text><text x="90" y="262" font-size="18" fill="#20363b">• 整体旋转或反射</text><text x="455" y="178" font-size="18" fill="#20363b">• QᵀQ=Iₙ</text><text x="455" y="220" font-size="18" fill="#20363b">• QQᵀ=P</text><text x="455" y="262" font-size="18" fill="#20363b">• 投影到子空间</text><text x="400" y="355" text-anchor="middle" font-size="16" fill="#5b6b72">检查矩阵尺寸才能判断 QQᵀ 是否为单位矩阵。</text></svg>