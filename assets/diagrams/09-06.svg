<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="09-06-t 09-06-d"><title id="09-06-t">主元策略</title><desc id="09-06-d">零主元或很小主元时使用行交换。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536b70"/></marker></defs><rect width="800" height="380" rx="16" fill="#fff"/><text x="35" y="38" font-size="14" font-weight="800" letter-spacing="1.4" fill="#137d78">09-06</text><rect x="55" y="92" width="325" height="210" rx="16" fill="#e7f3ef" stroke="#137d78" stroke-width="2"/><rect x="420" y="92" width="325" height="210" rx="16" fill="#fff0e8" stroke="#c7684b" stroke-width="2"/><text x="217" y="130" text-anchor="middle" font-size="21" font-weight="700" fill="#137d78">无主元</text><text x="582" y="130" text-anchor="middle" font-size="21" font-weight="700" fill="#c7684b">部分选主元</text><text x="90" y="178" font-size="18" fill="#20363b">• 首个主元可能为 0</text><text x="90" y="220" font-size="18" fill="#20363b">• 小主元放大误差</text><text x="90" y="262" font-size="18" fill="#20363b">• 可能无法继续</text><text x="455" y="178" font-size="18" fill="#20363b">• 选择较大主元</text><text x="455" y="220" font-size="18" fill="#20363b">• 记录行交换 P</text><text x="455" y="262" font-size="18" fill="#20363b">• PA=LU</text><text x="400" y="345" text-anchor="middle" font-size="16" fill="#5b6b72">对比条件与适用范围</text></svg>