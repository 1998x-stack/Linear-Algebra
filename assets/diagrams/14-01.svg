<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="14-01-t 14-01-d"><title id="14-01-t">对角化条件</title><desc id="14-01-d">普通对角化与正交对角化要求不同。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536b70"/></marker></defs><rect width="800" height="380" fill="#fff"/><text x="35" y="38" font-size="14" font-weight="800" fill="#137d78">14-01</text><rect x="55" y="92" width="325" height="210" rx="16" fill="#e7f3ef" stroke="#137d78" stroke-width="2"/><rect x="420" y="92" width="325" height="210" rx="16" fill="#fff0e8" stroke="#c7684b" stroke-width="2"/><text x="217" y="130" text-anchor="middle" font-size="21" fill="#137d78">普通对角化</text><text x="582" y="130" text-anchor="middle" font-size="21" fill="#c7684b">谱定理</text><text x="90" y="178" font-size="18" fill="#20363b">• 有足够独立特征向量</text><text x="90" y="220" font-size="18" fill="#20363b">• P 不一定正交</text><text x="90" y="262" font-size="18" fill="#20363b">• P⁻¹ 不一定是 Pᵀ</text><text x="455" y="178" font-size="18" fill="#20363b">• 实对称矩阵</text><text x="455" y="220" font-size="18" fill="#20363b">• Q 正交</text><text x="455" y="262" font-size="18" fill="#20363b">• Q⁻¹=Qᵀ</text><text x="400" y="355" text-anchor="middle" font-size="16" fill="#5b6b72">普通对角化与正交对角化要求不同。</text></svg>