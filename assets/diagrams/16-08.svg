<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="16-08-t 16-08-d"><title id="16-08-t">SVD 教学压缩与 JPEG</title><desc id="16-08-d">SVD 是全局低秩近似；JPEG 使用局部变换和量化。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536b70"/></marker></defs><rect width="800" height="380" fill="#fff"/><text x="35" y="38" font-size="14" font-weight="800" fill="#137d78">16-08</text><rect x="55" y="92" width="325" height="210" rx="16" fill="#e7f3ef" stroke="#137d78" stroke-width="2"/><rect x="420" y="92" width="325" height="210" rx="16" fill="#fff0e8" stroke="#c7684b" stroke-width="2"/><text x="217" y="130" text-anchor="middle" font-size="21" fill="#137d78">SVD 低秩</text><text x="582" y="130" text-anchor="middle" font-size="21" fill="#c7684b">JPEG 编码</text><text x="90" y="178" font-size="18" fill="#20363b">• 全局矩阵模式</text><text x="90" y="220" font-size="18" fill="#20363b">• 奇异值截断</text><text x="90" y="262" font-size="18" fill="#20363b">• Frobenius 最优</text><text x="455" y="178" font-size="18" fill="#20363b">• 局部图像块</text><text x="455" y="220" font-size="18" fill="#20363b">• 频率变换量化</text><text x="455" y="262" font-size="18" fill="#20363b">• 感知与熵编码</text><text x="400" y="355" text-anchor="middle" font-size="16" fill="#5b6b72">SVD 是全局低秩近似；JPEG 使用局部变换和量化。</text></svg>