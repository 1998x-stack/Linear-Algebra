<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
<title id="t">两个线性方程对应两条直线</title><desc id="d">直线 x 加 y 等于 3 与直线 x 减 y 等于 1 在点 2,1 相交；交点就是方程组的唯一解。</desc>
<defs><marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4"><circle cx="4" cy="4" r="3" fill="#1c2d35"/></marker></defs>
<g stroke="#e6ece8" stroke-width="1"><path d="M70 40V320M130 40V320M190 40V320M250 40V320M310 40V320M370 40V320M430 40V320M490 40V320M550 40V320M40 60H600M40 120H600M40 180H600M40 240H600M40 300H600"/></g>
<g stroke="#6b7b80" stroke-width="2"><path d="M45 270H600M100 325V35"/></g>
<path d="M100 0L370 270" stroke="#147d78" stroke-width="4" fill="none"/><path d="M100 360L370 90" stroke="#c7684b" stroke-width="4" fill="none"/>
<circle cx="280" cy="180" r="7" fill="#1c2d35"/><path d="M280 180V270M100 180H280" stroke="#1c2d35" stroke-dasharray="5 5" opacity=".6"/>
<text x="292" y="168" font-size="18" font-weight="700" fill="#1c2d35">(2, 1)</text><text x="380" y="110" font-size="16" fill="#c7684b">x − y = 1</text><text x="375" y="250" font-size="16" fill="#147d78">x + y = 3</text>
<text x="575" y="292" font-size="13" fill="#52656b">x</text><text x="112" y="42" font-size="13" fill="#52656b">y</text>
</svg>