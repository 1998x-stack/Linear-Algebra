<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="15-08-t 15-08-d"><title id="15-08-t">中心化与尺度</title><desc id="15-08-d">标准 PCA 中心化但默认不按特征缩放。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536b70"/></marker></defs><rect width="800" height="380" fill="#fff"/><text x="35" y="38" font-size="14" font-weight="800" fill="#137d78">15-08</text><rect x="55" y="92" width="325" height="210" rx="16" fill="#e7f3ef" stroke="#137d78" stroke-width="2"/><rect x="420" y="92" width="325" height="210" rx="16" fill="#fff0e8" stroke="#c7684b" stroke-width="2"/><text x="217" y="130" text-anchor="middle" font-size="21" fill="#137d78">中心化</text><text x="582" y="130" text-anchor="middle" font-size="21" fill="#c7684b">标准化</text><text x="90" y="178" font-size="18" fill="#20363b">• 减去均值</text><text x="90" y="220" font-size="18" fill="#20363b">• 保留特征单位</text><text x="90" y="262" font-size="18" fill="#20363b">• 影响点云中心</text><text x="455" y="178" font-size="18" fill="#20363b">• 除以标准差</text><text x="455" y="220" font-size="18" fill="#20363b">• 改变特征尺度</text><text x="455" y="262" font-size="18" fill="#20363b">• 改变主轴方向</text><text x="400" y="355" text-anchor="middle" font-size="16" fill="#5b6b72">标准 PCA 中心化但默认不按特征缩放。</text></svg>